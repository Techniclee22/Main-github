<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Follow along</title>
    <link rel="stylesheet" href="./reader.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Follow along</p>
        <h1 id="title">Waiting for text…</h1>
      </div>
      <div class="controls">
        <button type="button" class="btn" id="pauseBtn" hidden>Pause</button>
        <button type="button" class="btn" id="resumeBtn" hidden>Resume</button>
        <button type="button" class="btn ghost" id="stopBtn" hidden>Stop</button>
      </div>
    </header>
    <main class="page">
      <p id="body" class="body">
        Click <strong>Read</strong> on the floating pill after picking your PDF
        window. The words will appear here so you can read along.
      </p>
    </main>
    <script src="./speech.js"></script>
    <script src="./reader.js"></script>
  </body>
</html>

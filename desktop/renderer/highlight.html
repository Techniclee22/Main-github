<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reading highlight</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      .band {
        width: 100%;
        height: 100%;
        background: rgba(255, 200, 60, 0.35);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="band" aria-hidden="true"></div>
  </body>
</html>
